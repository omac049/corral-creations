<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Corral Creations loading</title>
  <desc id="desc">An animated coral C, yarn ball, crochet hook, hearts, stars, and leaves.</desc>
  <defs>
    <clipPath id="ball-clip"><circle cx="145" cy="157" r="43"/></clipPath>
    <linearGradient id="coral" x1="63" y1="33" x2="180" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF7FA0"/><stop offset="1" stop-color="#D95F87"/>
    </linearGradient>
    <style>
      .c-mark{fill:none;stroke:url(#coral);stroke-width:18;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:430;animation:draw-c 2.4s cubic-bezier(.23,1,.32,1) infinite}
      .c-highlight{fill:none;stroke:#F9A9BE;stroke-width:3;stroke-linecap:round;opacity:.8;stroke-dasharray:64 18}
      .ball{transform-origin:145px 157px;animation:ball-roll 2.4s cubic-bezier(.77,0,.175,1) infinite}
      .ball-base{fill:#FFF8F2;stroke:#E86E94;stroke-width:4}
      .yarn{fill:none;stroke:#E86E94;stroke-width:2.35;stroke-linecap:round}
      .hook{transform-origin:197px 132px;animation:hook-lift 2.4s cubic-bezier(.77,0,.175,1) infinite}
      .hook-main{fill:none;stroke:#31554B;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .hook-glint{fill:none;stroke:#FFF8F2;stroke-width:1.7;stroke-linecap:round;opacity:.9}
      .leaf{fill:#8E9A6F;transform-box:fill-box;transform-origin:center;animation:leaf-breathe 2.4s ease-in-out infinite}
      .spark{fill:#EE88A6;transform-box:fill-box;transform-origin:center;animation:spark 2.4s cubic-bezier(.23,1,.32,1) infinite}
      .spark.two{animation-delay:.22s}.spark.three{animation-delay:.42s}
      .heart-outline{fill:none;stroke:#E86E94;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .heart-fill{fill:#E86E94;animation:heart-beat 2.4s cubic-bezier(.23,1,.32,1) infinite;transform-box:fill-box;transform-origin:center}
      @keyframes draw-c{0%{stroke-dashoffset:430;opacity:.45}38%,86%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-430;opacity:.45}}
      @keyframes ball-roll{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
      @keyframes hook-lift{0%,100%{transform:translateY(1px) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}
      @keyframes leaf-breathe{0%,100%{transform:scale(.92);opacity:.62}50%{transform:scale(1);opacity:1}}
      @keyframes spark{0%,20%,100%{transform:scale(.65) rotate(-12deg);opacity:.35}52%,74%{transform:scale(1) rotate(0);opacity:1}}
      @keyframes heart-beat{0%,28%,100%{transform:scale(.9)}42%{transform:scale(1.08)}55%{transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.c-mark{stroke-dashoffset:0}.leaf,.spark,.heart-fill{opacity:1}}
    </style>
  </defs>

  <path class="c-mark" d="M169 62c-7-25-36-36-62-27-39 13-57 55-51 96 6 42 34 70 72 72 20 1 37-6 51-17"/>
  <path class="c-highlight" d="M99 45C75 57 65 83 65 111M67 127c4 24 17 44 36 55"/>

  <g class="ball">
    <circle class="ball-base" cx="145" cy="157" r="43"/>
    <g clip-path="url(#ball-clip)">
      <path class="yarn" d="M99 148c22-24 60-30 92-8M98 160c28-19 63-22 94-4M103 174c26-12 54-13 82-3M116 119c24 10 43 28 60 54M104 127c29 13 52 34 69 61M139 112c-20 25-27 50-27 78M153 114c-19 27-23 51-18 85M169 121c-16 24-18 47-10 72M111 135c26 2 52 13 77 32"/>
      <path class="yarn" d="M105 181c21 6 46 7 72-2M124 113c-8 23-9 48-2 76" opacity=".7"/>
    </g>
  </g>

  <g class="hook">
    <path class="hook-main" d="M160 204 220 79c3-7 12-8 15-2 3 6-2 13-8 13"/>
    <path class="hook-glint" d="m165 194 54-111c2-4 5-6 9-5"/>
  </g>

  <path class="heart-outline" d="M91 112c-16-12-29 8-7 25l7 6 7-6c22-17 9-37-7-25Z"/>
  <path class="heart-fill" d="M120 111c-17-13-31 9-8 27l8 7 8-7c23-18 9-40-8-27Z"/>

  <path class="leaf" d="M187 194c10-8 20-8 28-5-6 9-15 14-28 5ZM205 181c6-11 15-15 24-15-1 11-9 19-24 15ZM224 161c3-12 10-19 19-22 2 11-3 21-19 22ZM113 196c-10-4-16-11-17-20 10 1 18 7 17 20Z"/>
  <path d="M174 204c29-3 51-20 66-51" fill="none" stroke="#75855F" stroke-width="2.4" stroke-linecap="round"/>

  <path class="spark" d="m248 97 4.5 8.5 9.5 2-7 6.5 1 9.5-8-4.5-8.5 4.5 1.5-9.5-7-6.5 9.5-2 4.5-8.5Z"/>
  <path class="spark two" d="m55 184 4 7.5 8.5 1.5-6 6 1 8.5-7.5-4-7.5 4 1-8.5-6-6 8.5-1.5 4-7.5Z"/>
  <path class="spark three" d="m80 203 3.3 6.2 7 1.3-5 4.8.8 7-6.1-3.4-6.2 3.4.9-7-5.1-4.8 7-1.3 3.2-6.2Z" fill="#8E9A6F"/>
</svg>
